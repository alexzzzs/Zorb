name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: host-linux
            zig_arch: x86_64
            artifact_name: zorb-release-linux-x64
            output_dir: artifacts/compiler/linux-x64
            asset_name: zorb-compiler-linux-x64-${{ github.ref_name }}.zip
          - os: ubuntu-24.04-arm
            platform: linux
            target: host-linux-aarch64
            zig_arch: aarch64
            artifact_name: zorb-release-linux-arm64
            output_dir: artifacts/compiler/linux-arm64
            asset_name: zorb-compiler-linux-arm64-${{ github.ref_name }}.zip
          - os: windows-latest
            platform: windows
            target: host-windows
            artifact_name: zorb-release-win-x64
            output_dir: artifacts/compiler/win-x64
            asset_name: zorb-compiler-win-x64-${{ github.ref_name }}.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release toolchain
        if: matrix.platform == 'linux'
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev g++ minisign
          bash scripts/install-zig-linux.sh "${{ matrix.zig_arch }}"
          echo "$PWD/zig-${{ matrix.zig_arch }}-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cache Zig build artifacts
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
          key: release-${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-

      - name: Install release toolchain
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/install-llvm-windows.ps1
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          "$PWD/zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Zig build artifacts
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~\AppData\Local\zig
          key: release-${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-

      - name: Discover LLVM library paths
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $llvmPrefix = if (Test-Path "$env:ProgramFiles\LLVM") {
            Resolve-Path "$env:ProgramFiles\LLVM"
          } else {
            throw "LLVM install root was not found under $env:ProgramFiles\LLVM"
          }

          $llvmLib = Get-ChildItem -Path $llvmPrefix -Filter LLVM-C.lib -Recurse -File -ErrorAction Stop |
            Select-Object -First 1
          if ($null -eq $llvmLib) {
            throw "Unable to find LLVM-C.lib under $llvmPrefix"
          }

          "LLVM_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_LIB_DIR=$(Split-Path $llvmLib.FullName -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute release version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish standalone compiler
        if: matrix.platform == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          cat > "$RUNNER_TEMP/no-dotnet/dotnet" <<'EOF'
          #!/usr/bin/env bash
          echo "dotnet must not be used by the release bootstrap path" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          python3 scripts/bootstrap_compiler.py publish "${{ matrix.output_dir }}"

      - name: Publish standalone compiler
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $noDotnetDir = Join-Path $env:RUNNER_TEMP "zorb-no-dotnet"
          New-Item -ItemType Directory -Force -Path $noDotnetDir | Out-Null
          @"
          @echo off
          echo dotnet must not be used by the release bootstrap path 1>&2
          exit /b 97
          "@ | Set-Content -LiteralPath (Join-Path $noDotnetDir "dotnet.cmd") -Encoding ASCII
          $env:PATH = "$noDotnetDir;$env:PATH"
          python scripts/bootstrap_compiler.py publish "${{ matrix.output_dir }}"

      - name: Write version metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ matrix.output_dir }}/version.txt" <<EOF
          version=${{ steps.version.outputs.version }}
          tag=${GITHUB_REF_NAME}
          commit=${GITHUB_SHA}
          EOF

      - name: Smoke test release directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            compiler="${{ matrix.output_dir }}/zorb"
            executable="$RUNNER_TEMP/zorb-release-smoke"
          else
            compiler="${{ matrix.output_dir }}/zorb.exe"
            executable="$RUNNER_TEMP/zorb-release-smoke.exe"
          fi
          "$compiler" check compiler/driver/main.zorb
          "$compiler" build tests/csharp/fixtures/runtime_hello_world/main.zorb --output-kind llvm-ir -o "$RUNNER_TEMP/zorb-release-smoke.ll"
          "$compiler" build tests/csharp/fixtures/runtime_hello_world/main.zorb -o "$executable"
          test -s "$RUNNER_TEMP/zorb-release-smoke.ll"
          test -s "$executable"
          test "$("$executable")" = "ok"

      - name: Package release asset
        if: matrix.platform == 'linux'
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          python3 scripts/package_release.py \
            "${{ matrix.output_dir }}" \
            "release-assets/$ASSET_NAME" \
            --target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT"

      - name: Package release asset
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          python scripts/package_release.py `
            "${{ matrix.output_dir }}" `
            "release-assets/$env:ASSET_NAME" `
            --target $env:RELEASE_TARGET `
            --version $env:RELEASE_VERSION `
            --commit $env:RELEASE_COMMIT

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*

  create-release:
    needs: build-release-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Generate checksums and signatures
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PUBLIC_KEY_FINGERPRINT: ${{ secrets.MINISIGN_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "${MINISIGN_SECRET_KEY:-}" || -z "${MINISIGN_PUBLIC_KEY:-}" || -z "${MINISIGN_PUBLIC_KEY_FINGERPRINT:-}" ]]; then
            echo "::error::MINISIGN_SECRET_KEY, MINISIGN_PUBLIC_KEY, and MINISIGN_PUBLIC_KEY_FINGERPRINT GitHub secrets are required for release signing."
            exit 1
          fi

          public_key_path="release-assets/MINISIGN_PUBLIC_KEY"
          printf '%s' "$MINISIGN_PUBLIC_KEY" > "$public_key_path"
          public_key_sha256="$(sha256sum "$public_key_path" | cut -d ' ' -f1)"
          expected_public_key_fingerprint="${MINISIGN_PUBLIC_KEY_FINGERPRINT,,}"
          if [[ ! "$expected_public_key_fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::MINISIGN_PUBLIC_KEY_FINGERPRINT must be a 64-character SHA-256 hex digest."
            exit 1
          fi
          if [[ "$public_key_sha256" != "$expected_public_key_fingerprint" ]]; then
            echo "::error::MINISIGN_PUBLIC_KEY does not match MINISIGN_PUBLIC_KEY_FINGERPRINT."
            exit 1
          fi
          printf '%s  MINISIGN_PUBLIC_KEY\n' "$public_key_sha256" > release-assets/MINISIGN_PUBLIC_KEY.sha256

          mapfile -t release_files < <(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.zip' -o -name '*.provenance.json' \) \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "::error::No ZIP or provenance files were downloaded for signing."
            exit 1
          fi
          mapfile -t zip_files < <(
            find release-assets -maxdepth 1 -type f -name '*.zip' \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#zip_files[@]}" -eq 0 ]]; then
            echo "::error::No ZIP files were downloaded for signing."
            exit 1
          fi
          mapfile -t provenance_files < <(
            find release-assets -maxdepth 1 -type f -name '*.provenance.json' \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#provenance_files[@]}" -eq 0 ]]; then
            echo "::error::No provenance manifests were downloaded for signing."
            exit 1
          fi
          (cd release-assets && sha256sum "${release_files[@]}" > SHA256SUMS)

          key_file="$RUNNER_TEMP/minisign-release.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          chmod 600 "$key_file"
          minisign -S -s "$key_file" -m release-assets/SHA256SUMS \
            -x release-assets/SHA256SUMS.minisig -q
          for manifest in "${provenance_files[@]}"; do
            manifest_path="release-assets/$manifest"
            minisign -S -s "$key_file" -m "$manifest_path" -x "$manifest_path.minisig" -q
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
