name: Compiler CI

on:
  push:
  pull_request:

jobs:
  test:
    name: linux-hosted-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime test toolchains
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++

      - name: Install Zig 0.16
        run: |
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-llvm22-

      - name: Build LLVM backend
        run: |
          cd backend/llvm
          zig build test
          zig build -Dstatic-llvm=true -Dcxx-runtime="$(g++ -print-file-name=libstdc++.so)" -Doptimize=ReleaseSafe

      - name: Test cross-platform bootstrap tooling
        run: python3 -m unittest discover -s tests/python -v

      - name: Run native compiler suite without .NET
        run: python3 scripts/test_compiler.py

  linux-aarch64-cross:
    name: linux-aarch64-cross
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ZORB_RUN_AARCH64_TESTS: "1"
      ZORB_TEST_COMMAND_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AArch64 cross-runtime toolchains
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++ gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user

      - name: Install Zig 0.16
        run: |
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-llvm22-

      - name: Build LLVM backend
        run: |
          cd backend/llvm
          zig build test
          zig build -Dstatic-llvm=true -Dcxx-runtime="$(g++ -print-file-name=libstdc++.so)" -Doptimize=ReleaseSafe

      - name: Run native AArch64 cross-target suite without .NET
        run: |
          python3 scripts/test_compiler.py \
            --target host-linux-aarch64 \
            --runtime-target host-linux-aarch64

  linux-arm64-native-compiler:
    name: linux-arm64-native-compiler
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35

    permissions:
      contents: read

    env:
      ZORB_AARCH64_LINUX_GCC: /zorb-native-arm64-must-not-use-cross-gcc
      ZORB_QEMU_AARCH64: /zorb-native-arm64-must-not-use-qemu

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native ARM64 release toolchain
        run: |
          test "$(uname -m)" = "aarch64"
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++ minisign
          bash scripts/install-zig-linux.sh aarch64
          echo "$PWD/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-llvm22-

      - name: Publish native ARM64 compiler without .NET
        run: |
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          cat > "$RUNNER_TEMP/no-dotnet/dotnet" <<'EOF'
          #!/usr/bin/env bash
          echo "dotnet must not be used by the normal ARM64 bootstrap path" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          set +e
          python3 scripts/bootstrap_compiler.py publish "artifacts/compiler/linux-arm64" 2>&1 | tee "$RUNNER_TEMP/zorb-arm64-publisher.log"
          publisher_status=${PIPESTATUS[0]}
          set -e
          if [[ $publisher_status -ne 0 ]]; then
            details="$(tail -40 "$RUNNER_TEMP/zorb-arm64-publisher.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Native ARM64 compiler publish failed::$details"
            exit "$publisher_status"
          fi

      - name: Smoke test native ARM64 compiler
        run: |
          set -euo pipefail
          compiler="artifacts/compiler/linux-arm64/zorb"
          executable="$RUNNER_TEMP/zorb-arm64-native-smoke"
          readelf -h "$compiler" | grep -Eq 'Machine:[[:space:]]+AArch64'
          "$compiler" check compiler/driver/main.zorb
          "$compiler" build tests/csharp/fixtures/runtime_hello_world/main.zorb --target host-linux-aarch64 -o "$executable"
          readelf -h "$executable" | grep -Eq 'Machine:[[:space:]]+AArch64'
          test "$("$executable")" = "ok"
          test "$("$compiler" run tests/csharp/fixtures/runtime_hello_world/main.zorb --target host-linux-aarch64)" = "ok"

      - name: Run native ARM64 compiler suite without .NET
        run: |
          python3 scripts/test_compiler.py \
            --compiler artifacts/compiler/linux-arm64/zorb \
            --target host-linux-aarch64 \
            --runtime-target host-linux-aarch64 \
            --no-bootstrap

      - name: Upload native ARM64 compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: zorb-compiler-linux-arm64
          path: artifacts/compiler/linux-arm64

  linux-seed-bootstrap:
    name: linux-x64-bootstrap-without-dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bootstrap toolchains
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Cache Zig and bootstrap artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
            build/bootstrap
          key: seed-bootstrap-${{ runner.os }}-${{ hashFiles('bootstrap/manifest.json', 'scripts/bootstrap_*.py', 'backend/llvm/build.zig', 'backend/llvm/src/**') }}

      - name: Bootstrap without the C# recovery compiler
        run: |
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          cat > "$RUNNER_TEMP/no-dotnet/dotnet" <<'EOF'
          #!/usr/bin/env bash
          echo "dotnet must not be used by the normal bootstrap path" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          python3 scripts/bootstrap_compiler.py bootstrap build/zorb-seeded
          build/zorb-seeded check compiler/driver/main.zorb

  linux-native-parity:
    name: linux-native-frontend-parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ZORB_FRONTEND_PARITY_ONLY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend bootstrap toolchains
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build LLVM backend
        run: |
          cd backend/llvm
          zig build -Dstatic-llvm=true -Dcxx-runtime="$(g++ -print-file-name=libstdc++.so)" -Doptimize=ReleaseSafe

      - name: Run native frontend outcome gate without .NET
        run: python3 scripts/test_compiler.py --frontend-only

  windows-hosted-smoke:
    name: windows-hosted-x64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 22 and Zig 0.16
        shell: pwsh
        run: |
          ./scripts/install-llvm-windows.ps1
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          "$PWD/zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~\AppData\Local\zig
          key: ${{ runner.os }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-llvm22-

      - name: Discover LLVM library paths
        shell: pwsh
        run: |
          $llvmPrefix = if (Test-Path "$env:ProgramFiles\LLVM") {
            Resolve-Path "$env:ProgramFiles\LLVM"
          } else {
            throw "LLVM install root was not found under $env:ProgramFiles\LLVM"
          }

          $llvmLib = Get-ChildItem -Path $llvmPrefix -Filter LLVM-C.lib -Recurse -File -ErrorAction Stop |
            Select-Object -First 1
          if ($null -eq $llvmLib) {
            throw "Unable to find LLVM-C.lib under $llvmPrefix"
          }

          "LLVM_PREFIX=$llvmPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLVM_LIB_DIR=$(Split-Path $llvmLib.FullName -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build LLVM backend
        shell: pwsh
        run: |
          Set-Location backend/llvm
          zig build test
          zig build "-Dllvm-prefix=$env:LLVM_PREFIX" "-Dllvm-lib-dir=$env:LLVM_LIB_DIR" "-Dllvm-library=LLVM-C" "-Doptimize=ReleaseSafe"

      - name: Build native fixture compiler from released seed
        shell: pwsh
        run: |
          $nativeCompilerDir = Join-Path $env:RUNNER_TEMP "zorb-native-fixture"
          $noDotnetDir = Join-Path $env:RUNNER_TEMP "zorb-no-dotnet"
          New-Item -ItemType Directory -Force -Path $noDotnetDir | Out-Null
          @"
          @echo off
          echo dotnet must not be used by the normal bootstrap path 1>&2
          exit /b 97
          "@ | Set-Content -LiteralPath (Join-Path $noDotnetDir "dotnet.cmd") -Encoding ASCII
          $env:PATH = "$noDotnetDir;$env:PATH"
          try {
            python scripts/bootstrap_compiler.py publish $nativeCompilerDir
            if ($LASTEXITCODE -ne 0) {
              throw "Windows native compiler publish failed with exit code $LASTEXITCODE."
            }
          }
          catch {
            $message = $_.Exception.Message.Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=Windows native compiler publish failed::$message"
            throw
          }

          $nativeCompiler = Join-Path $nativeCompilerDir "zorb.exe"
          if (-not (Test-Path -LiteralPath $nativeCompiler -PathType Leaf)) {
            throw "Native fixture compiler was not produced at '$nativeCompiler'."
          }

          & $nativeCompiler check compiler/driver/main.zorb
          if ($LASTEXITCODE -ne 0) {
            throw "Native fixture compiler smoke check failed with exit code $LASTEXITCODE."
          }

          "ZORB_NATIVE_FIXTURE_COMPILER=$nativeCompiler" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run native Windows compiler suite without .NET
        shell: pwsh
        run: |
          python scripts/test_compiler.py `
            --compiler "$env:ZORB_NATIVE_FIXTURE_COMPILER" `
            --target host-windows `
            --runtime-target host-windows `
            --no-bootstrap

  publish-standalone:
    needs:
      - test
      - linux-aarch64-cross
      - linux-arm64-native-compiler
      - linux-seed-bootstrap
      - linux-native-parity
      - windows-hosted-smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zorb-compiler-linux-x64
          - os: windows-latest
            artifact_name: zorb-compiler-win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release toolchain
        if: matrix.os == 'ubuntu-latest'
        run: |
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev lld-22 g++
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install release toolchain
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/install-llvm-windows.ps1
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          "$PWD/zig-x86_64-windows-0.16.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Zig build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-llvm22-

      - name: Cache Zig build artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            backend/llvm/.zig-cache
            ~\AppData\Local\zig
          key: ${{ runner.os }}-zig-0.16.0-llvm22-${{ hashFiles('backend/llvm/build.zig', 'backend/llvm/src/**', 'backend/llvm/include/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-0.16.0-llvm22-

      - name: Compute version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=8 HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            informational_version="$version"
          else
            base_version="$(python scripts/project_version.py)"
            version="${base_version}.${GITHUB_RUN_NUMBER}"
            informational_version="${version}+${short_sha}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "informational_version=$informational_version" >> "$GITHUB_OUTPUT"

      - name: Publish standalone compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          cat > "$RUNNER_TEMP/no-dotnet/dotnet" <<'EOF'
          #!/usr/bin/env bash
          echo "dotnet must not be used by the normal Linux bootstrap path" >&2
          exit 97
          EOF
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          python3 scripts/bootstrap_compiler.py publish "artifacts/compiler/linux-x64"

      - name: Publish standalone compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $noDotnetDir = Join-Path $env:RUNNER_TEMP "zorb-no-dotnet"
          New-Item -ItemType Directory -Force -Path $noDotnetDir | Out-Null
          @"
          @echo off
          echo dotnet must not be used by the normal Windows bootstrap path 1>&2
          exit /b 97
          "@ | Set-Content -LiteralPath (Join-Path $noDotnetDir "dotnet.cmd") -Encoding ASCII
          $env:PATH = "$noDotnetDir;$env:PATH"
          python scripts/bootstrap_compiler.py publish "artifacts/compiler/win-x64"

      - name: Record version metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/compiler
          cat > "artifacts/compiler/version.txt" <<EOF
          version=${{ steps.version.outputs.version }}
          informational_version=${{ steps.version.outputs.informational_version }}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF}
          EOF

      - name: Smoke test published compiler
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            compiler="artifacts/compiler/linux-x64/zorb"
            executable="/tmp/zorb-release-smoke"
          else
            compiler="artifacts/compiler/win-x64/zorb.exe"
            executable="$RUNNER_TEMP/zorb-release-smoke.exe"
          fi
          "$compiler" check compiler/driver/main.zorb
          "$compiler" build tests/csharp/fixtures/runtime_hello_world/main.zorb --output-kind llvm-ir -o "$RUNNER_TEMP/zorb-release-smoke.ll"
          "$compiler" build tests/csharp/fixtures/runtime_hello_world/main.zorb -o "$executable"
          test -s "$RUNNER_TEMP/zorb-release-smoke.ll"
          test -s "$executable"
          test "$("$executable")" = "ok"

      - name: Upload standalone compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/compiler
